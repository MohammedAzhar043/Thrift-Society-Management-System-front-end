<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Force HTTPS: if loaded over HTTP, redirect immediately so browser shows secure -->
    <script>
      (function() {
        if (window.location.protocol === 'http:' && (window.location.hostname === 'kranthimahila.org' || window.location.hostname === 'www.kranthimahila.org')) {
          window.location.replace('https://' + window.location.hostname + window.location.pathname + window.location.search + window.location.hash);
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kranthimahila Society Management System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
